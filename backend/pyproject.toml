[project]
name = "modest-chic-backend"
version = "0.1.0"
description = "Async API backend for Modest Chic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "arq>=0.26",
    "asyncpg>=0.29",
    "bcrypt>=4.2",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "redis>=5.1",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
modest-chic-backend = "modest_chic_backend.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0,<5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modest_chic_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv]
default-groups = ["dev"]
