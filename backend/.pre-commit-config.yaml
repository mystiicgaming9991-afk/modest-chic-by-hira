# =============================================================================
# Pre-commit Configuration
# =============================================================================
# Install from the repository root: uv run --project backend pre-commit install -c backend/.pre-commit-config.yaml
# Run all backend files from the repository root: uv run --project backend pre-commit run -c backend/.pre-commit-config.yaml --all-files
# Update hooks: pre-commit autoupdate
# =============================================================================

default_language_version:
  python: python3.12

files: ^backend/

repos:
  # ---------------------------------------------------------------------------
  # General hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(\.codex/|graphify-out/)
      - id: end-of-file-fixer
        exclude: ^(\.codex/|graphify-out/)
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
        exclude: ^helm/templates/
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^graphify-out/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # ---------------------------------------------------------------------------
  # Ruff - Linting and Formatting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]

  # ---------------------------------------------------------------------------
  # MyPy - Type Checking
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend source)
        entry: uv run --project backend mypy --config-file backend/pyproject.toml backend/src
        language: system
        files: ^backend/src/.*\.py$
        pass_filenames: false
        stages: [manual]

  # ---------------------------------------------------------------------------
  # Security - Bandit
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml, -ll, -r, backend/src/]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Dockerfile linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [--ignore, DL3008, --ignore, DL3013]

  # ---------------------------------------------------------------------------
  # Shell script linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        exclude: ^\.codex/

ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly
  skip: [mypy]  # Skip mypy in CI (run separately for better caching)
default_install_hook_types:
  - pre-commit
